name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint + typecheck
        run: |
          npm run lint
          npm run typecheck

      # Pinned: resolving "latest" hits GitHub's API rate limit now and then.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Image pulls fail now and then (registry rate limits) — retry before giving up.
      - name: Start local Supabase
        run: |
          for attempt in 1 2 3; do
            supabase start && exit 0
            echo "supabase start failed (attempt $attempt), retrying in 30s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1

      - name: Write .env.local from the local stack
        run: |
          node - <<'EOF'
          const { execSync } = require("node:child_process");
          const s = JSON.parse(execSync("supabase status -o json").toString());
          const lines = [
            `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`,
            `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY ?? s.ANON_KEY}`,
            `SUPABASE_SECRET_KEY=${s.SECRET_KEY ?? s.SERVICE_ROLE_KEY}`,
            `NEXT_PUBLIC_SITE_URL=http://localhost:3000`,
          ];
          require("node:fs").writeFileSync(".env.local", lines.join("\n") + "\n");
          console.log(lines.join("\n"));
          EOF

      - name: Unit + integration tests (with coverage gate)
        run: npm run test:coverage

      # The browser download sometimes hangs: keep it in a cache keyed by the
      # Playwright version, and retry the download when it has to happen.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only the browser download (no apt) — safe to kill and retry.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "browser download failed (attempt $attempt), retrying"
          done
          exit 1

      # System packages through apt. Never kill apt mid-run (it keeps the dpkg
      # lock); let it retry stalled mirrors itself and wait for the lock instead.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          for attempt in 1 2 3; do
            while sudo fuser /var/lib/dpkg/lock-frontend > /dev/null 2>&1; do sleep 5; done
            npx playwright install-deps chromium && exit 0
            echo "apt install failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Reset + seed the database for E2E
        run: |
          npm run db:reset
          node scripts/seed.mjs

      - name: E2E tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
