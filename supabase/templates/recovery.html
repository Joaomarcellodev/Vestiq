<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f6f2fb;font-family:Arial,Helvetica,sans-serif;color:#1d1a22">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#7027b8">VESTIQ</p>
                <h1 style="margin:0 0 16px;font-size:22px">Redefinir sua senha</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5">
                  Recebemos um pedido para redefinir a senha da sua conta no Vestiq. Clique no
                  botão abaixo para escolher uma senha nova.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7027b8;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:8px">Redefinir senha</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#6b6475">
                  O link vale por 1 hora. Se você não pediu para trocar a senha, pode ignorar este
                  email — a sua senha atual continua a mesma.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
