<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f6f2fb;font-family:Arial,Helvetica,sans-serif;color:#1d1a22">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#7027b8">VESTIQ</p>
                <h1 style="margin:0 0 16px;font-size:22px">Você tem um convite no Vestiq</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5">
                  Uma fábrica convidou sua loja para a rede dela. Use o botão abaixo para entrar
                  no Vestiq e aceitar o convite.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink" style="display:inline-block;background:#7027b8;color:#ffffff;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:8px">Entrar e ver o convite</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#6b6475">
                  O link vale por 1 hora e pode ser usado uma vez. Se não pediu este acesso, pode
                  ignorar este email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
